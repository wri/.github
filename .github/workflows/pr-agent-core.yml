name: PR Agent Core

# Central reusable workflow. Repositories consume this via a tiny
# `.github/workflows/pr-agent.yml` shim and keep secrets in their own context.
on:
  workflow_call:

jobs:
  pr_agent:
    # Defense in depth:
    # 1. Only PRs whose BASE branch is the repo's default branch.
    # 2. Only trusted slash-command authors for issue comments.
    # 3. Optional repo allowlist through PR_AGENT_REPOS.
    if: |
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/describe') ||
        contains(github.event.comment.body, '/improve') ||
        contains(github.event.comment.body, '/ask') ||
        contains(github.event.comment.body, '/update_changelog')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association))) &&
      (vars.PR_AGENT_REPOS == '' ||
       vars.PR_AGENT_REPOS == '*' ||
       contains(format(',{0},', vars.PR_AGENT_REPOS), format(',{0},', github.repository)))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # PR-Agent filters out lockfiles as auto-generated, so a PR that only
      # bumps a lockfile yields an empty diff and the tool errors out.
      - name: Check for reviewable changes
        id: reviewable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr="${{ github.event.issue.number }}"
          else
            pr="${{ github.event.pull_request.number }}"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/$pr/files" \
            --paginate --jq '.[].filename')
          # Mirrors PR-Agent's AUTO_GENERATED_FILES_EXACT list plus minified
          # assets and source maps.
          ignored='(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|Gemfile\.lock|poetry\.lock|go\.sum|uv\.lock|Cargo\.lock|Pipfile\.lock|mix\.lock|pubspec\.lock|bun\.lockb)$|\.(min\.js|min\.css|js\.map|ts\.map|css\.map)$'
          # Guard against grep exiting 1 when every file matches $ignored.
          count=$(printf '%s\n' "$files" | { grep -vE "$ignored" || true; } | sed '/^[[:space:]]*$/d' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_reviewable=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reviewable=false" >> "$GITHUB_OUTPUT"
            echo "Only lockfiles/minified assets changed; skipping PR-Agent review."
          fi

      - name: Note skipped review
        if: steps.reviewable.outputs.has_reviewable == 'false' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.reviewable.outputs.pr }}" \
            --repo "${{ github.repository }}" \
            --body "PR-Agent skipped: this PR only changes lockfiles/minified assets, which PR-Agent treats as auto-generated and excludes from review."

      # Dynamically choose a model tier by diff complexity.
      - name: Select model by change complexity
        id: select_model
        if: steps.reviewable.outputs.has_reviewable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ steps.reviewable.outputs.pr }}"
          if ! data=$(gh api "repos/${{ github.repository }}/pulls/$pr/files" \
            --paginate --jq '.[] | "\(.additions + .deletions) \(.filename)"'); then
            echo "gh api failed; defaulting to light tier"
            echo "tier=light" >> "$GITHUB_OUTPUT"
            echo "model=openrouter/deepseek/deepseek-v4.1-flash" >> "$GITHUB_OUTPUT"
            echo "fallback_models=[\"openrouter/z-ai/glm-5.3-flash\"]" >> "$GITHUB_OUTPUT"
            echo "max_tokens=64000" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ignored='(^|[[:space:]/])(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|Gemfile\.lock|poetry\.lock|go\.sum|uv\.lock|Cargo\.lock|Pipfile\.lock|mix\.lock|pubspec\.lock|bun\.lockb)$|\.(min\.js|min\.css|js\.map|ts\.map|css\.map)$'
          data=$(printf '%s\n' "$data" | { grep -vE "$ignored" || true; } | sed '/^[[:space:]]*$/d')
          lines=$(printf '%s\n' "$data" | awk '{s+=$1} END {print s+0}')
          files=$(printf '%s\n' "$data" | awk 'NF {n++} END {print n+0}')

          if [ "$lines" -gt 1000 ] || [ "$files" -gt 20 ]; then
            tier=heavy
            model='openrouter/z-ai/glm-5.3'
            fallbacks='["openrouter/deepseek/deepseek-v4.1-flash-1017"]'
            max_tokens='128000'
          else
            tier=light
            model='openrouter/deepseek/deepseek-v4.1-flash-1017'
            fallbacks='["openrouter/z-ai/glm-5.3-flash"]'
            max_tokens='64000'
          fi

          echo "Diff: $lines changed lines across $files files -> $tier tier"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "fallback_models=$fallbacks" >> "$GITHUB_OUTPUT"
          echo "max_tokens=$max_tokens" >> "$GITHUB_OUTPUT"

      - name: Run PR Agent review
        if: steps.reviewable.outputs.has_reviewable == 'true'
        uses: the-pr-agent/pr-agent@v0.49.0
        env:
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_PR_AGENT }}
          config.model: '${{ steps.select_model.outputs.model }}'
          config.fallback_models: '${{ steps.select_model.outputs.fallback_models }}'
          config.custom_model_max_tokens: '${{ steps.select_model.outputs.max_tokens }}'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
